name: Mise à jour stats Wembanyama

on:
  # Déclenché automatiquement quand tu pushes data/wemby_stats.json
  push:
    branches: [main]
    paths:    [data/wemby_stats.json]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérification du fichier de stats
        run: |
          python3 -c "
          import json
          with open('data/wemby_stats.json') as f:
              d = json.load(f)
          for s, g in d.get('game_logs', {}).items():
              print(f'{s}: {len(g)} matchs')
          print('last_updated:', d.get('last_updated','?'))
          "
