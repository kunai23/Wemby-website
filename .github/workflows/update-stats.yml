name: Mise à jour stats Wembanyama

on:
  # Déclenché manuellement après avoir poussé de nouvelles données
  workflow_dispatch:
  # Ou automatiquement si data/wemby_stats.json est modifié sur main
  push:
    branches: [main]
    paths:    [data/wemby_stats.json]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérification du fichier de stats
        run: |
          python3 -c "
          import json
          with open('data/wemby_stats.json') as f:
              d = json.load(f)
          for s, g in d.get('game_logs', {}).items():
              print(f'{s}: {len(g)} matchs')
          print('last_updated:', d.get('last_updated','?'))
          "
