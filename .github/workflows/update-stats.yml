name: Mise à jour stats Wembanyama

on:
  # Runs every day at 07:00 UTC (9h Paris) and again at 22:00 UTC (post-game)
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 22 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest Wembanyama stats
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python scripts/fetch_stats.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/wemby_stats.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & push updated stats
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "wemby-bot"
          git config user.email "wemby-bot@noreply.github.com"
          git add data/wemby_stats.json
          git commit -m "auto: mise à jour stats Wembanyama $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
